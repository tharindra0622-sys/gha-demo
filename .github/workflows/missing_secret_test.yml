name: Missing Secret Test
on:
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        run: |
          mkdir -p dist
          echo "build output" > dist/app.txt
          echo "Build finished"

      - name: Deploy to production
        env:
          DEPLOY_API_KEY: ${{ secrets.DEPLOY_API_KEY }}
        run: |
          echo "Starting deployment..."
          if [ -z "$DEPLOY_API_KEY" ]; then
            echo "ERROR: DEPLOY_API_KEY is not set. Add it under Settings > Secrets and variables > Actions."
            echo "Deployment aborted: authentication failed (no API key)."
            exit 1
          fi
          echo "Deploying with key..."
