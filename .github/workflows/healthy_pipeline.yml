name: Healthy Pipeline
on:
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Create project files
        run: |
          mkdir -p healthy_demo/shop healthy_demo/tests
          touch healthy_demo/shop/__init__.py
          cat > healthy_demo/shop/pricing.py <<'EOF'
          def apply_discount(price, percent):
              """Return the price after taking off a percentage."""
              if price < 0:
                  raise ValueError("price must not be negative")
              if not 0 <= percent <= 100:
                  raise ValueError("percent must be between 0 and 100")
              return round(price - (price * percent / 100), 2)


          def add_tax(price, rate=0.08):
              """Return the price with tax added."""
              return round(price * (1 + rate), 2)
          EOF
          cat > healthy_demo/tests/test_pricing.py <<'EOF'
          import pytest

          from shop.pricing import add_tax, apply_discount


          def test_ten_percent_discount():
              assert apply_discount(200, 10) == 180


          def test_zero_discount():
              assert apply_discount(50, 0) == 50


          def test_full_discount():
              assert apply_discount(80, 100) == 0


          def test_bad_percent():
              with pytest.raises(ValueError):
                  apply_discount(100, 150)


          def test_add_tax():
              assert add_tax(100) == 108.0
          EOF

      - name: Install tools
        run: pip install pytest flake8

      - name: Lint
        working-directory: healthy_demo
        run: flake8 shop tests --max-line-length=100

      - name: Run unit tests
        working-directory: healthy_demo
        run: python -m pytest -v

      - name: Build package
        working-directory: healthy_demo
        run: |
          mkdir -p dist
          tar -czf dist/shop.tar.gz shop
          ls -l dist
